<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Sora, 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
<defs>
<marker id="arwRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
<marker id="arwGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
</defs>
<rect width="1200" height="660" fill="#0b1220"/>
<text x="48" y="56" fill="#e8eefc" font-size="27" font-weight="700">Impor Database SIMRS lewat phpMyAdmin</text>
<text x="48" y="86" fill="#93a6cc" font-size="15">Dengan setelan bawaan XAMPP (batas unggah 2 MB), hanya satu dari dua berkas berikut yang berhasil.</text>

<rect x="48" y="124" width="540" height="416" rx="16" fill="#111c33" stroke="#7f1d1d"/>
<rect x="76" y="152" width="484" height="78" rx="12" fill="#0f1729" stroke="#7f1d1d"/>
<text x="98" y="186" fill="#e8eefc" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">database/sik.sql</text>
<text x="98" y="210" fill="#f87171" font-size="13">19,3 MB &#183; batas unggah XAMPP: 2 MB</text>
<path d="M318,232 L318,292" stroke="#f87171" stroke-width="1.5" marker-end="url(#arwRed)"/>
<text x="332" y="266" fill="#93a6cc" font-size="13">diunggah ke phpMyAdmin</text>
<rect x="76" y="300" width="484" height="166" rx="12" fill="#1a1016" stroke="#7f1d1d"/>
<rect x="98" y="324" width="92" height="28" rx="14" fill="#7f1d1d"/>
<text x="144" y="343" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">&#10007; GAGAL</text>
<text x="98" y="386" fill="#f87171" font-size="15" font-weight="700">Berkas ditolak sebelum diproses</text>
<text x="98" y="412" fill="#93a6cc" font-size="12.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">Content-Length 19.296.285 byte</text>
<text x="98" y="432" fill="#93a6cc" font-size="12.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">melebihi batas 8.388.608 byte</text>
<text x="98" y="456" fill="#f87171" font-size="13">Hasil: 0 tabel &#8212; database tetap kosong</text>
<text x="76" y="502" fill="#7c8db5" font-size="12.5">phpMyAdmin tidak menampilkan pesan galat apa pun.</text>

<rect x="612" y="124" width="540" height="416" rx="16" fill="#111c33" stroke="#14532d"/>
<rect x="640" y="152" width="484" height="78" rx="12" fill="#0f1729" stroke="#14532d"/>
<text x="662" y="186" fill="#e8eefc" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">database/sik.sql.gz</text>
<text x="662" y="210" fill="#4ade80" font-size="13">1,3 MB &#183; jauh di bawah batas 2 MB</text>
<path d="M882,232 L882,292" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arwGrn)"/>
<text x="896" y="266" fill="#93a6cc" font-size="13">diunggah ke phpMyAdmin</text>
<rect x="640" y="300" width="484" height="166" rx="12" fill="#0c1a12" stroke="#14532d"/>
<rect x="662" y="324" width="112" height="28" rx="14" fill="#14532d"/>
<text x="718" y="343" fill="#bbf7d0" font-size="12.5" font-weight="700" text-anchor="middle">&#10003; BERHASIL</text>
<text x="662" y="386" fill="#4ade80" font-size="15" font-weight="700">Berkas diterima dan diimpor</text>
<text x="662" y="412" fill="#93a6cc" font-size="12.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">54 tabel &#183; 79.683 baris</text>
<text x="662" y="432" fill="#93a6cc" font-size="12.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">56 foreign key</text>
<text x="662" y="456" fill="#4ade80" font-size="13">dibaca lewat ekstensi zlib &#8212; selalu ada</text>
<text x="640" y="502" fill="#7c8db5" font-size="12.5">Isinya identik dengan sik.sql, jadi datanya sama persis.</text>

<text x="600" y="596" fill="#93a6cc" font-size="13" text-anchor="middle">Isi kedua berkas identik. Versi .zip tidak dipakai karena memerlukan ekstensi zip yang sering tidak aktif.</text>
</svg>
