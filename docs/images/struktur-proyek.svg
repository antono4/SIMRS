<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Sora, 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a6cc"/></marker>
</defs>
<rect width="1200" height="700" fill="#0b1220"/>
<text x="44" y="54" fill="#e8eefc" font-size="27" font-weight="700">Struktur Berkas</text>
<text x="44" y="82" fill="#93a6cc" font-size="15">Satu berkas per halaman di <tspan fill="#41f0c8" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">pages/</tspan>, kode bersama di <tspan fill="#ff8fb1" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">includes/</tspan>, aset statis di <tspan fill="#ffc466" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">assets/</tspan></text>

<rect x="44" y="116" width="200" height="404" rx="12" fill="#111c33" stroke="#2c4270"/>
<path d="M56,152 h176" stroke="#2c4270" opacity="0.7"/>
<rect x="45" y="117" width="4" height="34" rx="2" fill="#e8eefc"/>
<text x="62" y="141" fill="#e8eefc" font-size="14" font-weight="700">Akar proyek</text>
<text x="62" y="172" fill="#5aa9ff" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">index.php</text>
<text x="62" y="192" fill="#5aa9ff" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">config.php</text>
<text x="62" y="212" fill="#5aa9ff" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">.htaccess</text>
<text x="62" y="232" fill="#5aa9ff" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">info.php</text>
<text x="62" y="252" fill="#ffc466" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">install-database.bat</text>
<path d="M58,272 h172" stroke="#2c4270" opacity="0.7"/>
<text x="62" y="296" fill="#e8eefc" font-size="12">Front controller &#8594; routing</text>
<text x="62" y="315" fill="#e8eefc" font-size="12">autentikasi &#183; otorisasi 403</text>
<text x="62" y="341" fill="#93a6cc" font-size="12">Konfigurasi database,</text>
<text x="62" y="360" fill="#93a6cc" font-size="12">sesi, APP_VERSION,</text>
<text x="62" y="379" fill="#93a6cc" font-size="12">APP_MIN_PHP</text>
<text x="62" y="405" fill="#93a6cc" font-size="12">Pemasang database</text>
<text x="62" y="424" fill="#93a6cc" font-size="12">untuk Windows/XAMPP</text>
<text x="62" y="450" fill="#ff8fb1" font-size="12">Hapus info.php dan</text>
<text x="62" y="469" fill="#ff8fb1" font-size="12">diagnostik.php di produksi</text>

<rect x="264" y="116" width="392" height="404" rx="12" fill="#111c33" stroke="#2c4270"/>
<path d="M276,152 h368" stroke="#2c4270" opacity="0.7"/>
<rect x="265" y="117" width="4" height="34" rx="2" fill="#5aa9ff"/>
<text x="282" y="141" fill="#5aa9ff" font-size="14" font-weight="700">pages/ &#8212; satu berkas per halaman</text>
<text x="282" y="168" fill="#93a6cc" font-size="11.5">Master data</text>
<text x="282" y="188" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">pasien &#183; dokter &#183; poliklinik</text>
<text x="282" y="206" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">penjab &#183; perawatan</text>
<text x="282" y="232" fill="#93a6cc" font-size="11.5">Alur pasien</text>
<text x="282" y="252" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">registrasi &#183; antrian &#183; display</text>
<text x="282" y="270" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">tindakan &#183; diagnosa &#183; resep</text>
<text x="282" y="288" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">kamarinap</text>
<text x="282" y="314" fill="#93a6cc" font-size="11.5">Keuangan</text>
<text x="282" y="334" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">kasir &#183; billing &#183; laporan</text>
<text x="282" y="360" fill="#93a6cc" font-size="11.5">Administrasi</text>
<text x="282" y="380" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">users &#183; pengaturan &#183; akun</text>
<text x="282" y="398" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">admin &#183; login &#183; logout</text>
<text x="282" y="424" fill="#93a6cc" font-size="11.5">Instalasi &amp; galat</text>
<text x="282" y="444" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">install &#183; diagnostik</text>
<text x="282" y="462" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">403 &#183; 404 &#183; galat</text>
<text x="282" y="492" fill="#41f0c8" font-size="11.5">Daftarkan tiap halaman baru di array <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">$routes</tspan></text>
<text x="282" y="508" fill="#41f0c8" font-size="11.5">pada <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">index.php</tspan> agar bisa diakses.</text>

<rect x="676" y="116" width="248" height="404" rx="12" fill="#111c33" stroke="#2c4270"/>
<path d="M688,152 h224" stroke="#2c4270" opacity="0.7"/>
<rect x="677" y="117" width="4" height="34" rx="2" fill="#ff8fb1"/>
<text x="694" y="141" fill="#ff8fb1" font-size="14" font-weight="700">includes/</text>
<text x="694" y="168" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">db.php</text>
<text x="694" y="185" fill="#93a6cc" font-size="11">PDO + db_all/db_row/db_val/db_exec</text>
<text x="694" y="207" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">auth.php</text>
<text x="694" y="224" fill="#93a6cc" font-size="11">login AES_DECRYPT, sesi</text>
<text x="694" y="246" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">authz.php</text>
<text x="694" y="263" fill="#93a6cc" font-size="11">izin per modul (403)</text>
<text x="694" y="285" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">helpers.php</text>
<text x="694" y="302" fill="#93a6cc" font-size="11">url, flash, badge, palet poli</text>
<text x="694" y="324" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">kunjungan.php</text>
<text x="694" y="341" fill="#93a6cc" font-size="11">komponen kartu kunjungan</text>
<text x="694" y="363" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">antrian.php</text>
<text x="694" y="380" fill="#93a6cc" font-size="11">nomor, panggil, ringkasan</text>
<text x="694" y="402" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">settings.php</text>
<text x="694" y="419" fill="#93a6cc" font-size="11">identitas RS, tracker login</text>
<text x="694" y="441" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">header.php + footer.php</text>
<text x="694" y="458" fill="#93a6cc" font-size="11">kerangka tampilan AdminLTE</text>
<path d="M690,478 h220" stroke="#2c4270" opacity="0.7"/>
<text x="694" y="500" fill="#41f0c8" font-size="11">Modul boleh memakai includes/,</text>
<text x="694" y="515" fill="#41f0c8" font-size="11">bukan sebaliknya.</text>

<rect x="944" y="116" width="212" height="404" rx="12" fill="#111c33" stroke="#2c4270"/>
<path d="M956,152 h188" stroke="#2c4270" opacity="0.7"/>
<rect x="945" y="117" width="4" height="34" rx="2" fill="#ffc466"/>
<text x="962" y="141" fill="#ffc466" font-size="14" font-weight="700">Berkas lain</text>
<text x="962" y="170" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">assets/</text>
<text x="962" y="187" fill="#93a6cc" font-size="11">css &#183; fonts &#183; icons</text>
<text x="962" y="203" fill="#93a6cc" font-size="11">adminlte &#183; bootstrap</text>
<text x="962" y="219" fill="#93a6cc" font-size="11">chartjs &#183; favicon.svg</text>
<text x="962" y="245" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">database/</text>
<text x="962" y="262" fill="#93a6cc" font-size="11">sik.sql &#8212; 52 tabel</text>
<text x="962" y="278" fill="#93a6cc" font-size="11">skema + data contoh</text>
<text x="962" y="304" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">docs/images/</text>
<text x="962" y="321" fill="#93a6cc" font-size="11">diagram + tangkapan layar</text>
<text x="962" y="347" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">html/</text>
<text x="962" y="364" fill="#93a6cc" font-size="11">mockup statis (16 berkas,</text>
<text x="962" y="380" fill="#93a6cc" font-size="11">tanpa backend)</text>
<text x="962" y="406" fill="#e8eefc" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">.github/</text>
<text x="962" y="423" fill="#93a6cc" font-size="11">workflow autocommit</text>
<path d="M958,443 h184" stroke="#2c4270" opacity="0.7"/>
<text x="962" y="466" fill="#ff8fb1" font-size="11">Automasi penimpa README</text>
<text x="962" y="481" fill="#ff8fb1" font-size="11">sudah dihapus, jadi README</text>
<text x="962" y="496" fill="#ff8fb1" font-size="11">ini aman dirawat manual.</text>

<rect x="44" y="552" width="1112" height="112" rx="12" fill="#111c33" stroke="#2c4270"/>
<path d="M56,590 h1088" stroke="#2c4270" opacity="0.7"/>
<rect x="45" y="553" width="4" height="36" rx="2" fill="#41f0c8"/>
<text x="62" y="578" fill="#41f0c8" font-size="16" font-weight="700">Aturan penamaan yang konsisten</text>
<text x="62" y="606" fill="#e8eefc" font-size="12.5">Nama halaman di URL sama dengan nama berkas: <tspan fill="#5aa9ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">?page=kasir</tspan> dilayani oleh <tspan fill="#5aa9ff" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">pages/kasir.php</tspan>, dengan izin dari</text>
<text x="62" y="626" fill="#e8eefc" font-size="12.5"><tspan fill="#ff8fb1" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">PAGE_PERMISSIONS</tspan> di <tspan fill="#ff8fb1" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">includes/authz.php</tspan> yang memetakan halaman ke kolom izin pada tabel <tspan fill="#41f0c8" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">user</tspan>. Menu di sidebar</text>
<text x="62" y="646" fill="#e8eefc" font-size="12.5">disaring otomatis dari izin yang sama, tetapi pemeriksaan sebenarnya tetap di server (<tspan fill="#ff8fb1" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">index.php</tspan> menjawab 403).</text>

<path d="M244,300 H264" stroke="#93a6cc" stroke-width="2" fill="none" marker-end="url(#arw)"/>
<text x="254" y="292" fill="#93a6cc" font-size="10" text-anchor="middle">route</text>
<path d="M656,300 H676" stroke="#93a6cc" stroke-width="2" fill="none" marker-end="url(#arw)"/>
<text x="666" y="292" fill="#93a6cc" font-size="10" text-anchor="middle">pakai</text>
<path d="M924,300 H944" stroke="#93a6cc" stroke-width="2" fill="none" marker-end="url(#arw)"/>
</svg>
